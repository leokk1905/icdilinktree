<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICDI Links - International College of Digital Innovation</title>
    <link rel="stylesheet" href="icdiwebsite.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logos/logo.png" alt="ICDI Logo" class="logo">
        </div>

        <div class="links">
            <a href="https://www.icdi.cmu.ac.th/Home.aspx" target="_blank" class="link-button website">
                <div class="globe-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </div>
                <span class="link-text">www.icdi.cmu.ac.th</span>
            </a>

            <a href="https://www.facebook.com/icdicmu/" target="_blank" class="link-button facebook">
                <img src="logos/facebook.png" alt="Facebook" class="link-icon-img">
                <span class="link-text">Facebook</span>
            </a>

            <a href="https://www.youtube.com/c/ICDICMU" target="_blank" class="link-button youtube">
                <img src="logos/youtube.png" alt="YouTube" class="link-icon-img">
                <span class="link-text">YouTube</span>
            </a>

            <a href="https://www.instagram.com/icdicmu/" target="_blank" class="link-button instagram">
                <img src="logos/instagram.png" alt="Instagram" class="link-icon-img">
                <span class="link-text">Instagram</span>
            </a>

            <a href="https://www.tiktok.com/@cmuicdi?_t=ZS-90eA71wM6I3&_r=1" target="_blank" class="link-button tiktok">
                <img src="logos/tiktok.png" alt="TikTok" class="link-icon-img">
                <span class="link-text">TikTok</span>
            </a>
        </div>
    </div>
</body>
<!-- made by chanchai chan an ICDI student -->
</html>
